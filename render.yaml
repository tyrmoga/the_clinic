services:
  - type: web
    name: clinic-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /readyz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: TRUSTED_HOSTS
        value: "clinic-api-4b70.onrender.com"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic
