name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, migrate, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/clinic_test
      JWT_SECRET: ci-only-secret-use-32-bytes-minimum
      RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Run migrations
        run: |
          if compgen -G "migrations/versions/*.py" > /dev/null; then
            alembic upgrade head
          else
            echo "No migrations yet; skipping."
          fi

      - name: Seed demo data
        run: python -m app.seed

      - name: Test
        run: pytest -q

  deploy:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate production database
        if: env.RENDER_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ env.RENDER_DATABASE_URL }}
          APP_ENV: production
          JWT_SECRET: migration-only-placeholder-use-32-bytes
        run: alembic upgrade head

      - name: Seed demo data
        if: env.RENDER_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ env.RENDER_DATABASE_URL }}
          APP_ENV: production
          JWT_SECRET: migration-only-placeholder-use-32-bytes
        run: python -m app.seed

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --retry 3 -X POST "$RENDER_DEPLOY_HOOK_URL"
